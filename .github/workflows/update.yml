name: Update timetables

on:
  schedule:
    # Sunday-Thursday at about 06:45, 08:15, 10:15 and 13:05 Israel time.
    # GitHub cron is UTC, so both the winter (UTC+2) and summer (UTC+3) hours are listed;
    # the script sends the morning summary only once a day.
    - cron: "45 3,4 * * 0-4"
    - cron: "15 5,6,7,8 * * 0-4"
    - cron: "5 10,11 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the school site and build the pages
        env:
          NTFY_SALT: ${{ secrets.NTFY_SALT }}
        run: python3 tracker/build.py
      - name: Save the result
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update timetables"
          git push
