name: Update timetables

on:
  schedule:
    # Sunday-Thursday at about 06:45, 08:15, 10:15 and 13:05 Israel time.
    # GitHub cron is UTC, so both the winter (UTC+2) and summer (UTC+3) hours are listed;
    # the script sends the morning summary only once a day.
    - cron: "45 3,4 * * 0-4"
    - cron: "15 5,6,7,8 * * 0-4"
    - cron: "5 10,11 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Start from the latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the school site and build the pages
        env:
          NTFY_SALT: ${{ secrets.NTFY_SALT }}
        run: python3 tracker/build.py
      - name: Send notifications
        continue-on-error: true
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -n "$PUSH_TOKEN" ] && [ -n "$VAPID_PRIVATE_KEY" ]; then pip install -q pywebpush==2.5.0 && python3 tracker/push.py; else echo "notifications not set up"; fi
      - name: Save the result
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update timetables"
          # A code change pushed while this run was scanning must not make the push fail.
          git pull --rebase -X theirs origin main || git rebase --abort
          git push
